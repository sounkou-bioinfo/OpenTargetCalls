[package]
name = "opentargetcalls"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Vendor-independent short-read targeted calling for difficult genomic loci"
repository = "https://github.com/sounkou-bioinfo/OpenTargetCalls"
homepage = "https://github.com/sounkou-bioinfo/OpenTargetCalls"
documentation = "https://github.com/sounkou-bioinfo/OpenTargetCalls#readme"
readme = "README.md"
build = false
autobins = false

[lib]
name = "opentargetcalls"
path = "src/lib.rs"

[[bin]]
name = "opentargetcalls"
path = "src/bin/opentargetcalls.rs"

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
